<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4CF"/>
      <stop offset="100%" stop-color="#0B6E68"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <path id="spark" d="M0,-11 C1.2,-3.2 3.2,-1.2 11,0 C3.2,1.2 1.2,3.2 0,11 C-1.2,3.2 -3.2,1.2 -11,0 C-3.2,-1.2 -1.2,-3.2 0,-11 Z"/>
  </defs>

  <rect width="1200" height="280" rx="28" fill="url(#bg)"/>

  <!-- icon badge: a small network of nodes, nodding to "Router" -->
  <rect x="60" y="60" width="150" height="150" rx="36" fill="url(#badge)"/>
  <g transform="translate(88,88)" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.95">
    <line x1="15" y1="80" x2="47" y2="47"/>
    <line x1="79" y1="80" x2="47" y2="47"/>
    <line x1="47" y1="47" x2="47" y2="15"/>
    <line x1="15" y1="80" x2="79" y2="80"/>
  </g>
  <g transform="translate(88,88)" fill="#5EEAD4">
    <circle cx="47" cy="15" r="8"/>
    <circle cx="15" cy="80" r="8"/>
    <circle cx="79" cy="80" r="8"/>
  </g>
  <g transform="translate(88,88)" fill="#0E1F1C">
    <circle cx="47" cy="47" r="9"/>
  </g>

  <use href="#spark" x="222" y="72" fill="#FFE08A"/>
  <use href="#spark" x="66" y="222" fill="#FFE08A" transform="scale(0.7)" transform-origin="66 222"/>

  <!-- wordmark -->
  <text x="242" y="138" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="#FFFFFF">RouterGlock</text>
  <text x="244" y="178" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="500" fill="#FFFFFF" fill-opacity="0.92">Local-first AI tooling &amp; macOS utilities</text>
</svg>
